name: Deploy Game

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_VERSION: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Select environment
        id: env_select
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "wrangler_env=production" >> $GITHUB_OUTPUT
            echo "smoke_url=https://game.sinon.live/api/health" >> $GITHUB_OUTPUT
          else
            echo "wrangler_env=dev" >> $GITHUB_OUTPUT
            echo "smoke_url=https://dev-game.sinon.live/api/health" >> $GITHUB_OUTPUT
          fi

      - name: Validate Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Build OpenNext Cloudflare worker
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Worker
        run: pnpm dlx wrangler deploy --env ${{ steps.env_select.outputs.wrangler_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          set +e
          URL="${{ steps.env_select.outputs.smoke_url }}"
          OK=0
          for i in 1 2 3 4 5; do
            OUT=$(curl -fsS "$URL" 2>&1)
            CODE=$?
            if [ $CODE -eq 0 ]; then
              echo "$OUT"
              OK=1
              break
            fi
            echo "Smoke retry $i failed: $OUT"
            sleep 5
          done

          if [ $OK -eq 1 ]; then
            exit 0
          fi

          # Custom domain may still be propagating DNS right after first route deploy.
          # Do not block deployment on transient DNS resolution in bootstrap phase.
          if echo "$OUT" | grep -qi "Could not resolve host"; then
            echo "Warning: domain DNS not ready yet, skip-failing smoke for now."
            exit 0
          fi

          echo "Smoke check failed with non-DNS error"
          exit 1
