name: Deploy Game

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_VERSION: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Select environment
        id: env_select
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "wrangler_env=production" >> $GITHUB_OUTPUT
            echo "smoke_url=https://game.sinon.live/api/health" >> $GITHUB_OUTPUT
          else
            echo "wrangler_env=dev" >> $GITHUB_OUTPUT
            echo "smoke_url=https://dev-game.sinon.live/api/health" >> $GITHUB_OUTPUT
          fi

      - name: Validate Cloudflare secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)

      - name: Build OpenNext Cloudflare worker
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy Worker
        run: pnpm dlx wrangler deploy --env ${{ steps.env_select.outputs.wrangler_env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke check
        run: |
          curl -fsS "${{ steps.env_select.outputs.smoke_url }}"
